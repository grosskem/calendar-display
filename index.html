<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Themed Wall Calendar Display</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Cinzel:wght@600;700&family=Comfortaa:wght@600;700&family=Mountains+of+Christmas:wght@700&family=Patrick+Hand&family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--screen-backdrop, #14110e);
      color: var(--theme-ink, #251b14);
      font-family: var(--font-body, 'Source Sans 3'), sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 14px;
      overflow-x: hidden;
      transition: background-color 0.4s ease;
    }

    .calendar-frame {
      position: relative;
      width: 100%;
      max-width: 1440px;
      background: var(--paper-bg, #fffdf8);
      border-radius: 16px;
      box-shadow: 0 25px 65px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.08);
      display: grid;
      grid-template-columns: 1fr;
      overflow: hidden;
      transition: all 0.4s ease;
      border: 3px solid var(--board-border, #2d2016);
    }

    @media (min-width: 1100px) {
      .calendar-frame {
        grid-template-columns: 1fr 340px;
      }
    }

    .weekday-strip {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      border-bottom: 2.5px solid var(--grid-border, #2d2016);
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-family: var(--font-accent, 'Patrick Hand'), cursive;
      overflow: hidden;
    }

    .weekday-strip div {
      padding: 7px 0;
      text-align: center;
      border-right: 2px solid var(--grid-border, #2d2016);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .weekday-strip div:last-child { border-right: none; }

    .month-matrix {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      grid-template-rows: repeat(5, minmax(105px, 1fr));
      background-color: var(--grid-border, #2d2016);
      gap: 2px;
      border-bottom: 2px solid var(--grid-border, #2d2016);
    }

    .calendar-cell {
      background-color: var(--cell-bg, #ffffff);
      padding: 6px 7px;
      display: flex;
      flex-direction: column;
      position: relative;
      min-width: 0;
      min-height: 105px;
      transition: background-color 0.15s ease;
    }

    .calendar-cell.muted-cell {
      background-color: var(--cell-muted-bg, rgba(240, 235, 225, 0.45));
      opacity: 0.45;
    }

    .calendar-cell.today-cell {
      background-color: var(--cell-today-bg, #fff8ee);
      box-shadow: inset 0 0 0 2px var(--today-accent, #ea580c);
    }

    .day-number-badge {
      font-size: 1.25rem;
      font-weight: 700;
      line-height: 1;
      margin-bottom: 5px;
      color: var(--day-num-color, #1a120c);
      font-family: var(--font-accent, 'Patrick Hand'), cursive;
    }

    .calendar-cell.today-cell .day-number-badge {
      background-color: var(--today-accent, #ea580c);
      color: #ffffff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: 9999px;
      margin-left: -3px;
      margin-top: -3px;
    }

    .day-events-list {
      display: flex;
      flex-direction: column;
      gap: 3px;
      overflow-y: auto;
      max-height: 75px;
    }

    .event-badge {
      font-size: 0.8rem;
      padding: 2px 5px;
      border-radius: 4px;
      line-height: 1.15;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      box-shadow: 0 1px 2px rgba(0,0,0,0.06);
      font-family: var(--font-body, 'Source Sans 3'), sans-serif;
      font-weight: 600;
      border-left: 3.5px solid var(--chip-border, #d97706);
      background-color: var(--chip-bg, #fef3c7);
      color: var(--chip-text, #451a03);
    }

    .cal-theme-0 { border-left-color: #2563eb; background-color: #eff6ff; color: #1e3a8a; }
    .cal-theme-1 { border-left-color: #ea580c; background-color: #fff7ed; color: #7c2d12; }
    .cal-theme-2 { border-left-color: #9333ea; background-color: #faf5ff; color: #581c87; }
    .cal-theme-3 { border-left-color: #059669; background-color: #ecfdf5; color: #064e3b; }

    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 9999px; }
  </style>
</head>
<body>

  <header class="w-full max-w-[1440px] flex flex-wrap items-center justify-between gap-3 bg-zinc-900/90 text-zinc-100 px-4 py-2.5 rounded-full mb-3 backdrop-blur-md border border-zinc-800 text-xs sm:text-sm z-30 shadow-lg">
    <div class="flex items-center gap-3">
      <span class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
      <span class="font-bold tracking-wider font-mono text-amber-300 text-sm sm:text-base" id="wallClock">--:-- --</span>
      <span class="text-zinc-500">|</span>
      <span class="text-zinc-300 hidden md:inline" id="syncStatus">GCal: Idle</span>
    </div>

    <div class="flex items-center gap-2 flex-wrap">
      <div class="flex items-center bg-zinc-800 rounded-full px-2 py-0.5 border border-zinc-700">
        <button id="prevMonthBtn" class="px-2 py-0.5 hover:text-amber-400 font-bold transition">◀</button>
        <span id="currentMonthNavLabel" class="px-2 font-semibold text-xs tracking-wide">Month Year</span>
        <button id="nextMonthBtn" class="px-2 py-0.5 hover:text-amber-400 font-bold transition">▶</button>
      </div>

      <select id="themeDropdown" class="bg-zinc-800 hover:bg-zinc-750 text-zinc-100 rounded-full px-3 py-1 border border-zinc-700 text-xs outline-none cursor-pointer"></select>

      <button id="manualRefreshBtn" title="Refresh Google Calendar" class="bg-amber-600 hover:bg-amber-500 text-zinc-950 font-bold px-3 py-1 rounded-full transition flex items-center gap-1">
        <span>↻</span>
        <span class="hidden sm:inline">Sync</span>
      </button>

      <button id="fullscreenBtn" title="Toggle Fullscreen" class="bg-zinc-800 hover:bg-zinc-700 px-2.5 py-1 rounded-full text-zinc-300 transition">
        ⛶
      </button>
    </div>
  </header>

  <main class="calendar-frame" id="wallCalendarStage">
    <div class="flex flex-col min-w-0 bg-[var(--paper-bg)]">
      <div class="relative w-full h-[220px] sm:h-[240px] overflow-hidden select-none border-b-2 border-[var(--grid-border)]" id="bannerContainer"></div>
      <div class="weekday-strip" id="weekdayRow"></div>
      <div class="month-matrix" id="daysGrid"></div>

      <div class="px-6 py-2 flex justify-between items-center text-xs opacity-75 font-semibold" style="color: var(--theme-ink);">
        <span id="footerSeasonLabel">🍁 Seasonal Wall Edition</span>
        <span id="footerCalendarFeedLabel">cal.w4de.dev</span>
      </div>
    </div>

    <aside class="border-t-[3px] lg:border-t-0 lg:border-l-[3px] border-[var(--board-border)] p-5 flex flex-col bg-[var(--agenda-bg,var(--paper-bg))]" id="agendaSidebar">
      <div class="pb-3 border-b-2 border-[var(--grid-border)] mb-4 flex items-baseline justify-between">
        <div>
          <h2 class="text-2xl font-bold tracking-tight" style="font-family: var(--font-title);">Upcoming Events</h2>
          <p class="text-xs uppercase tracking-wider opacity-70 font-semibold" style="font-family: var(--font-accent);">Next 30 Days</p>
        </div>
        <span class="text-xs px-2 py-0.5 rounded-full font-bold bg-amber-500/20 text-amber-900 border border-amber-500/30" id="agendaCountBadge">0</span>
      </div>

      <div class="flex-1 overflow-y-auto space-y-3.5 pr-1 max-h-[600px] lg:max-h-[820px]" id="agendaList"></div>
    </aside>
  </main>

    const state = {
      displayedYear: 2026,
      displayedMonth: 9, // October = 9
      events: []
    };

    function applyTheme(monthIndex) {
      const theme = THEMES[monthIndex] || THEMES[9];
      const root = document.documentElement;

      root.style.setProperty("--screen-backdrop", theme.palette.screenBackdrop);
      root.style.setProperty("--paper-bg", theme.palette.paperBg);
      root.style.setProperty("--agenda-bg", theme.palette.agendaBg);
      root.style.setProperty("--board-border", theme.palette.boardBorder);
      root.style.setProperty("--grid-border", theme.palette.gridBorder);
      root.style.setProperty("--theme-ink", theme.palette.themeInk);
      root.style.setProperty("--cell-bg", theme.palette.cellBg);
      root.style.setProperty("--cell-muted-bg", theme.palette.cellMutedBg);
      root.style.setProperty("--cell-today-bg", theme.palette.cellTodayBg);
      root.style.setProperty("--today-accent", theme.palette.todayAccent);
      root.style.setProperty("--day-num-color", theme.palette.dayNumColor);
      root.style.setProperty("--chip-bg", theme.palette.chipBg);
      root.style.setProperty("--chip-text", theme.palette.chipText);
      root.style.setProperty("--chip-border", theme.palette.chipBorder);

      root.style.setProperty("--font-title", theme.fonts.title);
      root.style.setProperty("--font-accent", theme.fonts.accent);
      root.style.setProperty("--font-body", theme.fonts.body);

      const weekdayRow = document.getElementById("weekdayRow");
      weekdayRow.innerHTML = theme.weekdayColors.map(c => `
        <div style="background-color: ${c.bg}; color: ${c.text};">${c.name}</div>
      `).join("");

      document.getElementById("footerSeasonLabel").textContent = theme.footerNote;
    }

    function renderCalendar() {
      const monthNames = [
        "January", "February", "March", "April", "May", "June",
        "July", "August", "September", "October", "November", "December"
      ];

      const year = state.displayedYear;
      const month = state.displayedMonth;
      const monthName = monthNames[month];

      document.getElementById("currentMonthNavLabel").textContent = `${monthName} ${year}`;

      const theme = THEMES[month] || THEMES[9];
      document.getElementById("bannerContainer").innerHTML = theme.renderBanner(monthName, year);

      const firstDayOfMonth = new Date(year, month, 1).getDay();
      const daysInCurrentMonth = new Date(year, month + 1, 0).getDate();
      const daysInPriorMonth = new Date(year, month, 0).getDate();

      const today = new Date();
      const isActualCurrentMonth = (today.getFullYear() === year && today.getMonth() === month);
      const todayDateNumber = today.getDate();

      const daysGrid = document.getElementById("daysGrid");
      daysGrid.innerHTML = "";

      for (let i = firstDayOfMonth - 1; i >= 0; i--) {
        const num = daysInPriorMonth - i;
        const cell = document.createElement("div");
        cell.className = "calendar-cell muted-cell";
        cell.innerHTML = `<span class="day-number-badge">${num}</span>`;
        daysGrid.appendChild(cell);
      }

      const calClassMap = new Map();
      let colorIdx = 0;

      for (let day = 1; day <= daysInCurrentMonth; day++) {
        const cell = document.createElement("div");
        const isToday = isActualCurrentMonth && (day === todayDateNumber);
        cell.className = `calendar-cell ${isToday ? 'today-cell' : ''}`;

        const mStr = String(month + 1).padStart(2, '0');
        const dStr = String(day).padStart(2, '0');
        const dateKey = `${year}-${mStr}-${dStr}`;

        const matchingEvents = state.events.filter(e => e.date === dateKey);

        const chipsHtml = matchingEvents.slice(0, 3).map(e => {
          if (!calClassMap.has(e.calendarTitle)) {
            calClassMap.set(e.calendarTitle, `cal-theme-${colorIdx % 4}`);
            colorIdx++;
          }
          const themeClass = calClassMap.get(e.calendarTitle);
          return `
            <div class="event-badge ${themeClass}" title="${e.summary} (${e.time} - ${e.calendarTitle})">
              <span>${e.time !== "All Day" ? e.time + " " : ""}${e.summary}</span>
            </div>
          `;
        }).join("");

        cell.innerHTML = `
          <span class="day-number-badge">${day}</span>
          <div class="day-events-list">
            ${chipsHtml}
          </div>
        `;
        daysGrid.appendChild(cell);
      }

      const totalCellsFilled = firstDayOfMonth + daysInCurrentMonth;
      const targetTotal = totalCellsFilled <= 35 ? 35 : 42;
      const trailingDaysNeeded = targetTotal - totalCellsFilled;

      for (let day = 1; day <= trailingDaysNeeded; day++) {
        const cell = document.createElement("div");
        cell.className = "calendar-cell muted-cell";
        cell.innerHTML = `<span class="day-number-badge">${day}</span>`;
        daysGrid.appendChild(cell);
      }

      renderAgenda();
    }

    function renderAgenda() {
      const agendaList = document.getElementById("agendaList");
      agendaList.innerHTML = "";

      const now = new Date();
      now.setHours(0, 0, 0, 0);

      const upcoming = state.events
        .filter(e => {
          if (!e.date) return false;
          const [ey, em, ed] = e.date.split("-").map(Number);
          return new Date(ey, em - 1, ed) >= now;
        })
        .sort((a, b) => a.date.localeCompare(b.date))
        .slice(0, 10);

      document.getElementById("agendaCountBadge").textContent = upcoming.length;

      if (upcoming.length === 0) {
        agendaList.innerHTML = `
          <div class="p-4 text-center text-xs opacity-60 font-medium">
            No upcoming events found.
          </div>
        `;
        return;
      }

      upcoming.forEach(e => {
        const [ey, em, ed] = e.date.split("-").map(Number);
        const dObj = new Date(ey, em - 1, ed);
        const dateFormatted = dObj.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
        const isToday = (dObj.getTime() === now.getTime());

        const item = document.createElement("div");
        item.className = "p-3 rounded-lg border text-xs sm:text-sm transition-all";
        item.style.backgroundColor = isToday ? "var(--cell-today-bg)" : "rgba(255,255,255,0.7)";
        item.style.borderColor = isToday ? "var(--today-accent)" : "rgba(0,0,0,0.08)";
        item.style.borderLeftWidth = "4px";
        item.style.borderLeftColor = isToday ? "var(--today-accent)" : "var(--chip-border)";

        item.innerHTML = `
          <div class="flex items-center justify-between">
            <span class="text-[0.7rem] uppercase font-bold tracking-wider" style="color: var(--today-accent);">
              ${isToday ? 'Today • ' : ''}${dateFormatted}
            </span>
            <span class="text-[0.72rem] font-semibold opacity-75">${e.time}</span>
          </div>
          <div class="text-sm font-bold mt-1 text-[var(--theme-ink)]">
            ${e.summary}
          </div>
          <div class="text-[0.7rem] opacity-60 font-bold uppercase mt-0.5 tracking-wider">
            🏷️ ${e.calendarTitle}
          </div>
        `;
        agendaList.appendChild(item);
      });
    }

  async function syncGoogleCalendar() {
      const statusEl = document.getElementById("syncStatus");
      statusEl.textContent = "GCal: Syncing...";

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 12000);

      try {
        const res = await fetch(PROXY_URL, { signal: controller.signal });
        clearTimeout(timeoutId);

        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const rawEvents = await res.json();

        // Format dates and times in America/Chicago
        state.events = rawEvents.map(e => {
          if (e.allDay) {
            return {
              summary: e.summary,
              date: e.start, // YYYY-MM-DD
              time: "All Day",
              allDay: true,
              calendarTitle: e.calendarTitle
            };
          }

          const d = new Date(e.start);

          // Get year, month, and day in America/Chicago
          const dateParts = new Intl.DateTimeFormat("en-US", {
            timeZone: "America/Chicago",
            year: "numeric",
            month: "2-digit",
            day: "2-digit"
          }).formatToParts(d);

          const y = dateParts.find(p => p.type === "year").value;
          const m = dateParts.find(p => p.type === "month").value;
          const day = dateParts.find(p => p.type === "day").value;

          // Format time in America/Chicago
          const timeStr = new Intl.DateTimeFormat("en-US", {
            timeZone: "America/Chicago",
            hour: "numeric",
            minute: "2-digit",
            hour12: true
          }).format(d);

          return {
            summary: e.summary,
            date: `${y}-${m}-${day}`,
            time: timeStr,
            allDay: false,
            calendarTitle: e.calendarTitle
          };
        });

        statusEl.textContent = `GCal: Synced (${state.events.length} items)`;
      } catch (err) {
        clearTimeout(timeoutId);
        console.warn("Could not sync from worker:", err);
        statusEl.textContent = `GCal: Sync failed (${err.message})`;
      }

      renderCalendar();
    }

    function updateWallClock() {
      const now = new Date();
      let hours = now.getHours();
      const mins = String(now.getMinutes()).padStart(2, "0");
      const secs = String(now.getSeconds()).padStart(2, "0");
      const ampm = hours >= 12 ? "PM" : "AM";
      hours = hours % 12 || 12;
      document.getElementById("wallClock").textContent = `${hours}:${mins}:${secs} ${ampm}`;
    }

    function setMonthAndSyncTheme(mIndex) {
      state.displayedMonth = mIndex;
      applyTheme(mIndex);
      document.getElementById("themeDropdown").value = mIndex;
      renderCalendar();
    }

    function initUI() {
      const dropdown = document.getElementById("themeDropdown");
      dropdown.innerHTML = Object.entries(THEMES).map(([idx, t]) => `
        <option value="${idx}" ${Number(idx) === state.displayedMonth ? 'selected' : ''}>${t.name}</option>
      `).join("");

      dropdown.addEventListener("change", (e) => {
        setMonthAndSyncTheme(Number(e.target.value));
      });

      document.getElementById("prevMonthBtn").addEventListener("click", () => {
        let m = state.displayedMonth - 1;
        if (m < 0) {
          m = 11;
          state.displayedYear--;
        }
        setMonthAndSyncTheme(m);
      });

      document.getElementById("nextMonthBtn").addEventListener("click", () => {
        let m = state.displayedMonth + 1;
        if (m > 11) {
          m = 0;
          state.displayedYear++;
        }
        setMonthAndSyncTheme(m);
      });

      document.getElementById("manualRefreshBtn").addEventListener("click", syncGoogleCalendar);

      document.getElementById("fullscreenBtn").addEventListener("click", () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          document.exitFullscreen().catch(() => {});
        }
      });

      setInterval(updateWallClock, 1000);
      updateWallClock();
      setInterval(syncGoogleCalendar, 15 * 60 * 1000);
    }

    window.addEventListener("DOMContentLoaded", () => {
      const now = new Date();
      state.displayedMonth = now.getMonth();
      state.displayedYear = now.getFullYear();

      initUI();
      applyTheme(state.displayedMonth);
      renderCalendar();
      syncGoogleCalendar();
    });
  </script>
</body>
</html>
