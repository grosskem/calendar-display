<!DOCTYPE html>
<html lang="en" class="h-full w-full overflow-hidden">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wall Calendar Display</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Patrick Hand & Caveat for hand-crafted warmth, Outfit & Inter for crisp wall display legibility -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Outfit:wght@400;500;600;700;800&family=Patrick+Hand&family=Playfair+Display:ital,wght@1,600;1,700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Outfit', sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    .font-hand {
      font-family: 'Patrick Hand', 'Caveat', cursive;
    }
    .font-cursive {
      font-family: 'Playfair Display', Georgia, serif;
      font-style: italic;
    }

    /* Ultra-clean custom scrollbar for right-hand agenda */
    .custom-scroll::-webkit-scrollbar {
      width: 5px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: var(--theme-scroll-thumb, rgba(140, 75, 30, 0.25));
      border-radius: 9999px;
    }
    .custom-scroll::-webkit-scrollbar-thumb:hover {
      background: var(--theme-scroll-thumb, rgba(140, 75, 30, 0.45));
    }

    /* Fullscreen absolute bleed & zero border constraints */
    :fullscreen, :-webkit-full-screen, :-moz-full-screen, :-ms-fullscreen {
      margin: 0 !important;
      padding: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      overflow: hidden !important;
    }

    /* Subtle paper texture effect */
    .paper-texture {
      background-image: radial-gradient(rgba(0, 0, 0, 0.02) 1px, transparent 0);
      background-size: 24px 24px;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .spin-fast {
      animation: spin 0.8s linear infinite;
    }
  </style>
</head>
<body id="calendar-body" class="w-full h-full text-stone-800 paper-texture transition-colors duration-500">

  <!-- Edge-to-Edge Container (100vw x 100vh) -->
  <div id="calendar-root" class="w-full h-full flex flex-row overflow-hidden">

    <!-- LEFT 75%: Illustrated Art Banner + Weekday Strip + Dynamic Calendar Grid -->
    <main class="flex-1 flex flex-col h-full min-w-0 border-r border-black/10 overflow-hidden relative">

      <!-- MONTHLY ILLUSTRATED ART BANNER -->
      <section id="banner-section" class="relative h-36 md:h-40 lg:h-44 w-full flex items-center justify-between px-6 lg:px-10 shrink-0 overflow-hidden select-none border-b transition-colors duration-500">
        
        <!-- Layer 1: Ambient SVG Sky / Scenery Canvas -->
        <svg id="banner-sky-svg" class="absolute inset-0 w-full h-full pointer-events-none" preserveAspectRatio="none" viewBox="0 0 1200 180">
          <!-- Dynamically swapped sky gradient, moon, stars, or seasonal clouds -->
        </svg>

        <!-- Layer 2: Left Themed Hand-Drawn Characters & Elements -->
        <div id="art-left-container" class="relative z-10 flex items-end self-end mb-1 pointer-events-none">
          <!-- Injected detailed seasonal SVG illustration -->
        </div>

        <!-- Layer 3: Center Month & Year Header with Hand-Drawn Charm & Discreet Controls -->
        <div class="relative z-20 flex flex-col items-center justify-center text-center">
          <div class="flex items-center space-x-3">
            <!-- Discreet Previous Month button (Keyboard Left Arrow also works) -->
            <button id="btn-prev-month" title="Previous Month (Left Arrow)" class="p-1 rounded-full text-black/40 hover:text-black/80 hover:bg-black/5 active:scale-90 transition">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
            </button>

            <!-- Month Title -->
            <h1 id="month-title" class="font-cursive text-5xl md:text-6xl lg:text-7xl font-bold tracking-tight text-stone-900 drop-shadow-sm select-none">
              October
            </h1>

            <!-- Discreet Next Month button (Keyboard Right Arrow also works) -->
            <button id="btn-next-month" title="Next Month (Right Arrow)" class="p-1 rounded-full text-black/40 hover:text-black/80 hover:bg-black/5 active:scale-90 transition">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/></svg>
            </button>
          </div>

          <!-- Year subtitle & seasonal sparkles -->
          <div class="flex items-center space-x-2.5 mt-0.5">
            <span id="banner-sparkle-1" class="text-xs transition-colors duration-300">✦</span>
            <span id="year-title" class="font-bold tracking-widest text-xs md:text-sm uppercase opacity-80">2026</span>
            <span id="banner-sparkle-2" class="text-xs transition-colors duration-300">✦</span>
            <!-- Silent Refresh Status Indicator -->
            <span id="sync-dot" title="Sync Status" class="w-1.5 h-1.5 rounded-full bg-emerald-500/80 inline-block ml-1"></span>
          </div>
        </div>

        <!-- Layer 4: Right Themed Hand-Drawn Elements -->
        <div id="art-right-container" class="relative z-10 flex items-end self-end mb-1 pointer-events-none">
          <!-- Injected detailed seasonal SVG illustration -->
        </div>

      </section>

      <!-- WEEKDAY HEADER STRIP (7 Themed Pastel Ribbons) -->
      <div id="weekday-bar" class="grid grid-cols-7 border-b text-center font-bold text-[11px] md:text-xs select-none shrink-0 tracking-wider transition-colors duration-500">
        <div id="wk-sun" class="py-1.5 border-r border-black/10 transition-colors">SUN</div>
        <div id="wk-mon" class="py-1.5 border-r border-black/10 transition-colors">MON</div>
        <div id="wk-tue" class="py-1.5 border-r border-black/10 transition-colors">TUE</div>
        <div id="wk-wed" class="py-1.5 border-r border-black/10 transition-colors">WED</div>
        <div id="wk-thu" class="py-1.5 border-r border-black/10 transition-colors">THU</div>
        <div id="wk-fri" class="py-1.5 border-r border-black/10 transition-colors">FRI</div>
        <div id="wk-sat" class="py-1.5 transition-colors">SAT</div>
      </div>

      <!-- CALENDAR MONTH GRID (Fills Remaining Screen Height Proportionately) -->
      <div id="calendar-grid" class="grid grid-cols-7 flex-1 w-full divide-x divide-y divide-black/10 min-h-0 overflow-hidden bg-transparent">
        <!-- 35 or 42 cells rendered dynamically -->
      </div>

    </main>

    <!-- RIGHT 25%: UPCOMING EVENTS AGENDA PANEL -->
    <aside id="agenda-sidebar" class="w-80 sm:w-88 md:w-96 lg:w-[26rem] flex flex-col h-full shrink-0 select-none border-l border-black/10 transition-colors duration-500">
      
      <!-- Agenda Header -->
      <div class="px-5 py-4 border-b border-black/10 flex items-center justify-between shrink-0">
        <div>
          <h2 id="agenda-heading" class="font-hand text-2xl font-bold leading-tight tracking-wide">Upcoming Events</h2>
          <p id="agenda-subheading" class="text-[10px] font-bold tracking-widest uppercase opacity-60">Next 30 Days</p>
        </div>

        <div class="flex items-center space-x-2">
          <!-- Event Count Badge -->
          <span id="agenda-badge" class="px-2.5 py-0.5 text-xs font-bold rounded-full border transition-all duration-300">
            0
          </span>
          <!-- Discreet Sync & Fullscreen quick triggers -->
          <button id="btn-sync-quick" title="Sync with Google Calendar (Hotkey: R)" class="p-1.5 rounded-lg text-black/40 hover:text-black/80 hover:bg-black/5 active:scale-95 transition">
            <svg id="sync-svg-icon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
          </button>
          <button id="btn-fs-quick" title="Toggle Fullscreen" class="p-1.5 rounded-lg text-black/40 hover:text-black/80 hover:bg-black/5 active:scale-95 transition">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/></svg>
          </button>
        </div>
      </div>

      <!-- Agenda Scrollable Event Cards List -->
      <div id="agenda-list" class="flex-1 overflow-y-auto p-3.5 space-y-2.5 custom-scroll">
        <!-- Rendered cards -->
      </div>

      <!-- Subtle Footer with Live Time in America/Chicago -->
      <div class="px-4 py-2 border-t border-black/10 flex items-center justify-between text-[11px] opacity-70 shrink-0 font-medium font-mono">
        <span id="live-time-display">--:--:--</span>
        <span id="calendar-proxy-status">Synced</span>
      </div>

    </aside>

  </div>

    /* =====================================================================
       APP STATE & RUNTIME CONFIGURATION
       ===================================================================== */
    // Default to the current system date in America/Chicago
    let currentNavDate = new Date();
    let allCalendarEvents = [];
    let isFetching = false;

    // Apply the complete theme styles across the entire window
    function applyMonthlyTheme(themeIndex) {
      const theme = MONTH_THEMES[themeIndex];
      const root = document.getElementById("calendar-root");
      const body = document.getElementById("calendar-body");
      const banner = document.getElementById("banner-section");
      const sidebar = document.getElementById("agenda-sidebar");

      // Set global CSS variable for custom scrollbars
      document.documentElement.style.setProperty('--theme-scroll-thumb', theme.scrollThumb);

      // Backgrounds
      body.style.backgroundColor = theme.bodyBg;
      root.style.backgroundColor = theme.bodyBg;
      banner.style.backgroundColor = theme.bodyBg;
      sidebar.style.backgroundColor = theme.sidebarBg;

      // Header month text & sparkles
      const monthTitle = document.getElementById("month-title");
      monthTitle.textContent = theme.monthName;
      monthTitle.style.color = theme.textPrimary;

      const yearTitle = document.getElementById("year-title");
      yearTitle.textContent = currentNavDate.getFullYear();
      yearTitle.style.color = theme.accentColor;

      document.getElementById("banner-sparkle-1").style.color = theme.sparkleColor;
      document.getElementById("banner-sparkle-2").style.color = theme.sparkleColor;

      // Inject the rich thematic SVGs
      document.getElementById("banner-sky-svg").innerHTML = theme.skySvg;
      document.getElementById("art-left-container").innerHTML = theme.artLeft;
      document.getElementById("art-right-container").innerHTML = theme.artRight;

      // Color Weekday Strips
      const days = ["sun", "mon", "tue", "wed", "thu", "fri", "sat"];
      days.forEach((d, idx) => {
        const el = document.getElementById(`wk-${d}`);
        if (el) {
          el.style.backgroundColor = theme.weekdays[idx].bg;
          el.style.color = theme.weekdays[idx].text;
        }
      });

      // Sidebar header text & badge
      document.getElementById("agenda-heading").style.color = theme.textPrimary;
      const badge = document.getElementById("agenda-badge");
      badge.style.backgroundColor = theme.weekdays[0].bg;
      badge.style.borderColor = theme.weekdays[0].text;
      badge.style.color = theme.weekdays[0].text;
    }

    /* =====================================================================
       CALENDAR EVENT THEME PICKER (MONTH-AWARE COLOR HARMONY)
       ===================================================================== */
    function getEventClass(calTitle = "", monthTheme) {
      const lower = (calTitle || "").toLowerCase();
      if (lower.includes("wedding") || lower.includes("grosskreuz wedding")) {
        return monthTheme.weddingPill;
      }
      if (lower.includes("kayla")) {
        return monthTheme.kaylaPill;
      }
      return monthTheme.pillBase;
    }

    /* =====================================================================
       CALENDAR GRID BUILDER
       ===================================================================== */
    function renderCalendar() {
      const year = currentNavDate.getFullYear();
      const month = currentNavDate.getMonth();
      const theme = MONTH_THEMES[month];

      // Update theme visuals first
      applyMonthlyTheme(month);

      const grid = document.getElementById("calendar-grid");
      grid.innerHTML = "";

      // Month calculation math
      const firstDayOfMonth = new Date(year, month, 1);
      const startDayOfWeek = firstDayOfMonth.getDay(); // 0 = Sun
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const daysInPrevMonth = new Date(year, month, 0).getDate();

      // Today in America/Chicago
      const nowChicago = new Date(new Intl.DateTimeFormat("en-US", { timeZone: "America/Chicago" }).format(new Date()));
      const todayYear = nowChicago.getFullYear();
      const todayMonth = nowChicago.getMonth();
      const todayDate = nowChicago.getDate();

      // Determine 5 or 6 row layout
      let totalCells = 35;
      if (startDayOfWeek + daysInMonth > 35) {
        totalCells = 42;
        grid.style.gridTemplateRows = "repeat(6, minmax(0, 1fr))";
      } else {
        grid.style.gridTemplateRows = "repeat(5, minmax(0, 1fr))";
      }

      for (let i = 0; i < totalCells; i++) {
        const cell = document.createElement("div");
        cell.className = "p-1.5 md:p-2 flex flex-col justify-start overflow-hidden relative min-h-0 transition-colors";

        let dayNumber = 0;
        let isCurrentMonth = true;
        let cellYear = year;
        let cellMonth = month;

        if (i < startDayOfWeek) {
          // Filler from previous month
          dayNumber = daysInPrevMonth - (startDayOfWeek - 1 - i);
          isCurrentMonth = false;
          cellMonth = month - 1;
          cell.style.backgroundColor = "rgba(0, 0, 0, 0.025)";
          cell.style.opacity = "0.45";
        } else if (i >= startDayOfWeek + daysInMonth) {
          // Filler from next month
          dayNumber = i - (startDayOfWeek + daysInMonth) + 1;
          isCurrentMonth = false;
          cellMonth = month + 1;
          cell.style.backgroundColor = "rgba(0, 0, 0, 0.025)";
          cell.style.opacity = "0.45";
        } else {
          // Active month day
          dayNumber = i - startDayOfWeek + 1;
          cell.style.backgroundColor = "transparent";
        }

        const isToday = (cellYear === todayYear && cellMonth === todayMonth && dayNumber === todayDate);

        // Highlight Today with the month's signature accent color
        if (isToday) {
          cell.style.boxShadow = `inset 0 0 0 2.5px ${theme.accentColor}`;
          cell.style.backgroundColor = "rgba(255, 255, 255, 0.75)";
        }

        // Day Number Header inside cell
        const numHeader = document.createElement("div");
        numHeader.className = "flex items-center justify-between mb-1 shrink-0";
        
        const numSpan = document.createElement("span");
        numSpan.className = `text-xs md:text-sm font-semibold leading-none ${isToday ? "font-bold" : ""}`;
        numSpan.style.color = isToday ? theme.accentColor : theme.textPrimary;
        numSpan.textContent = dayNumber;
        numHeader.appendChild(numSpan);
        cell.appendChild(numHeader);

        // Events list inside cell
        const eventBox = document.createElement("div");
        eventBox.className = "space-y-1 overflow-y-auto custom-scroll flex-1 pr-0.5";

        const dateISO = `${cellYear}-${String(cellMonth + 1).padStart(2, "0")}-${String(dayNumber).padStart(2, "0")}`;

        const matchingEvents = allCalendarEvents.filter(ev => {
          if (!ev.start) return false;
          return ev.start.startsWith(dateISO);
        });

        matchingEvents.forEach(ev => {
          const pillClass = getEventClass(ev.calendarTitle, theme);
          const evPill = document.createElement("div");
          evPill.className = `text-[10px] sm:text-xs leading-tight px-1.5 py-0.5 rounded border shadow-sm font-medium truncate transition-transform hover:scale-[1.01] ${pillClass}`;

          let timeLabel = "";
          if (!ev.allDay && ev.start.includes("T")) {
            const timeStr = ev.start.split("T")[1];
            const [hh, mm] = timeStr.split(":");
            const d = new Date(2000, 0, 1, parseInt(hh, 10), parseInt(mm, 10));
            timeLabel = d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit", hour12: true }) + " ";
          }

          evPill.textContent = `${timeLabel}${ev.summary || "(No Title)"}`;
          evPill.title = `${ev.summary || "(No Title)"} • ${ev.calendarTitle || "General"}`;
          eventBox.appendChild(evPill);
        });

        cell.appendChild(eventBox);
        grid.appendChild(cell);
      }

      renderSidebarAgenda(theme);
    }

    /* =====================================================================
       AGENDA SIDEBAR BUILDER
       ===================================================================== */
    function renderSidebarAgenda(theme) {
      const list = document.getElementById("agenda-list");
      list.innerHTML = "";

      const now = new Date();
      const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());

      // Filter events from today onward up to 30 days
      const upcoming = allCalendarEvents
        .filter(ev => {
          if (!ev.start) return false;
          const evDate = new Date(ev.start);
          return !isNaN(evDate) && evDate >= todayStart;
        })
        .sort((a, b) => new Date(a.start) - new Date(b.start))
        .slice(0, 30);

      document.getElementById("agenda-badge").textContent = upcoming.length;

      if (upcoming.length === 0) {
        list.innerHTML = `
          <div class="text-center py-16 opacity-50 text-xs font-medium">
            No upcoming events in the next 30 days.
          </div>
        `;
        return;
      }

      upcoming.forEach(ev => {
        const evDate = new Date(ev.start);
        const pillClass = getEventClass(ev.calendarTitle, theme);

        const card = document.createElement("div");
        card.className = `p-2.5 rounded-xl border bg-white/90 shadow-sm transition hover:shadow-md ${pillClass}`;

        const dateStr = evDate.toLocaleDateString("en-US", {
          weekday: "short",
          month: "short",
          day: "numeric"
        }).toUpperCase();

        let timeStr = "All Day";
        if (!ev.allDay && ev.start.includes("T")) {
          timeStr = evDate.toLocaleTimeString("en-US", {
            hour: "numeric",
            minute: "2-digit",
            hour12: true
          });
        }

        card.innerHTML = `
          <div class="flex items-center justify-between text-[10px] font-bold tracking-wider mb-1 opacity-80">
            <span>${escapeHTML(dateStr)}</span>
            <span class="font-mono text-[9px] font-bold">${escapeHTML(timeStr)}</span>
          </div>
          <div class="text-xs sm:text-sm font-semibold leading-snug">
            ${escapeHTML(ev.summary || "(No Title)")}
          </div>
          <div class="text-[9px] opacity-60 mt-1 uppercase tracking-wider font-semibold">
            ${escapeHTML(ev.calendarTitle || "General")}
          </div>
        `;

        list.appendChild(card);
      });
    }

    function escapeHTML(str) {
      return (str || "").replace(/[&<>"']/g, match => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;"
      }[match]));
    }

    /* =====================================================================
       SILENT BACKGROUND GCAL SYNC ENGINE
       ===================================================================== */
    async function fetchCalendarEvents() {
      if (isFetching) return;
      isFetching = true;

      const syncDot = document.getElementById("sync-dot");
      const syncSvg = document.getElementById("sync-svg-icon");
      const statusLabel = document.getElementById("calendar-proxy-status");

      if (syncDot) syncDot.className = "w-1.5 h-1.5 rounded-full bg-amber-400 inline-block ml-1 animate-ping";
      if (syncSvg) syncSvg.classList.add("spin-fast");
      if (statusLabel) statusLabel.textContent = "Syncing...";

      try {
        const res = await fetch("https://calendar-proxy.mvgrosskreuz.workers.dev", {
          cache: "no-store"
        });

        if (!res.ok) {
          throw new Error(`HTTP ${res.status}`);
        }

        const data = await res.json();
        allCalendarEvents = Array.isArray(data) ? data : [];

        if (syncDot) syncDot.className = "w-1.5 h-1.5 rounded-full bg-emerald-500 inline-block ml-1";
        if (statusLabel) statusLabel.textContent = `Synced (${allCalendarEvents.length})`;
      } catch (err) {
        console.warn("Proxy sync error:", err);
        if (syncDot) syncDot.className = "w-1.5 h-1.5 rounded-full bg-rose-500 inline-block ml-1";
        if (statusLabel) statusLabel.textContent = "Sync Failed";
      } finally {
        isFetching = false;
        if (syncSvg) syncSvg.classList.remove("spin-fast");
        renderCalendar();
      }
    }

    /* =====================================================================
       LIVE CLOCK (America/Chicago)
       ===================================================================== */
    function updateClock() {
      const now = new Date();
      const timeStr = now.toLocaleTimeString("en-US", {
        timeZone: "America/Chicago",
        hour: "numeric",
        minute: "2-digit",
        second: "2-digit",
        hour12: true
      });
      const el = document.getElementById("live-time-display");
      if (el) el.textContent = timeStr;
    }
    setInterval(updateClock, 1000);
    updateClock();

    /* =====================================================================
       FULLSCREEN HELPER
       ===================================================================== */
    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          console.warn("Fullscreen toggle error:", err);
        });
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    /* =====================================================================
       INITIALIZATION & INTERACTION
       ===================================================================== */
    window.addEventListener("DOMContentLoaded", () => {
      // Month Chevron buttons
      document.getElementById("btn-prev-month").addEventListener("click", () => {
        currentNavDate.setMonth(currentNavDate.getMonth() - 1);
        renderCalendar();
      });

      document.getElementById("btn-next-month").addEventListener("click", () => {
        currentNavDate.setMonth(currentNavDate.getMonth() + 1);
        renderCalendar();
      });

      // Quick buttons
      document.getElementById("btn-sync-quick").addEventListener("click", fetchCalendarEvents);
      document.getElementById("btn-fs-quick").addEventListener("click", toggleFullScreen);

      // Keyboard Controls for wall convenience
      window.addEventListener("keydown", (e) => {
        if (e.key === "ArrowLeft") {
          currentNavDate.setMonth(currentNavDate.getMonth() - 1);
          renderCalendar();
        } else if (e.key === "ArrowRight") {
          currentNavDate.setMonth(currentNavDate.getMonth() + 1);
          renderCalendar();
        } else if (e.key.toLowerCase() === "t") {
          currentNavDate = new Date();
          renderCalendar();
        } else if (e.key.toLowerCase() === "r") {
          fetchCalendarEvents();
        } else if (e.key.toLowerCase() === "f") {
          toggleFullScreen();
        }
      });

      // Initial render & sync
      renderCalendar();
      fetchCalendarEvents();

      // Silent background sync every 5 minutes
      setInterval(fetchCalendarEvents, 5 * 60 * 1000);
    });
  </script>
</body>
</html>
