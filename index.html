<!DOCTYPE html>
<html lang="en" class="h-full w-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wall Calendar</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts for retro cursive styling and clean sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@1,600;1,700&display=swap" rel="stylesheet">

  <style>
    /* Font helpers */
    .font-cursive {
      font-family: 'Playfair Display', Georgia, serif;
      font-style: italic;
    }
    .font-handwriting {
      font-family: 'Caveat', cursive;
    }
    .font-sans {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    /* Custom Scrollbar for sidebar agenda */
    .custom-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: rgba(180, 83, 9, 0.2);
      border-radius: 9999px;
    }

    /* Fullscreen specifications: Strip header and make calendar touch all 4 viewport edges */
    :fullscreen #top-header,
    :-webkit-full-screen #top-header,
    :-moz-full-screen #top-header,
    :-ms-fullscreen #top-header {
      display: none !important;
    }

    :fullscreen body,
    :-webkit-full-screen body,
    :-moz-full-screen body,
    :-ms-fullscreen body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      overflow: hidden !important;
      background-color: #fcf8ee !important;
    }

    :fullscreen #app-viewport,
    :-webkit-full-screen #app-viewport,
    :-moz-full-screen #app-viewport,
    :-ms-fullscreen #app-viewport {
      padding: 0 !important;
      margin: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      max-width: 100vw !important;
      max-height: 100vh !important;
    }

    :fullscreen #main-card,
    :-webkit-full-screen #main-card,
    :-moz-full-screen #main-card,
    :-ms-fullscreen #main-card {
      border-radius: 0 !important;
      box-shadow: none !important;
      border: none !important;
      width: 100vw !important;
      height: 100vh !important;
    }

    /* Subtle animation on sync spinner */
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .anim-spin {
      animation: spin 1s linear infinite;
    }
  </style>
</head>
<body class="h-full w-full bg-[#120f0d] text-stone-800 font-sans antialiased overflow-hidden select-none">

  <!-- Outer Application Viewport Shell -->
  <div id="app-viewport" class="flex flex-col h-full w-full p-2 md:p-3 transition-all duration-150">

    <!-- Top Management & Status Header Bar -->
    <header id="top-header" class="flex items-center justify-between px-4 py-2 mb-2 bg-[#1f1b18] border border-stone-800 rounded-xl text-xs sm:text-sm text-stone-300 shrink-0 shadow-lg">
      <!-- Live Date, Time & Sync Indicator -->
      <div class="flex items-center space-x-3">
        <div class="flex items-center space-x-2 font-medium">
          <span class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-500 shadow-sm shadow-emerald-500/50"></span>
          <span id="live-datetime" class="text-amber-200/90 font-mono tracking-wide">Loading time...</span>
        </div>
        <span class="text-stone-600">|</span>
        <div id="sync-status" class="text-stone-400 font-medium">GCal: Connecting...</div>
      </div>

      <!-- Control Buttons -->
      <div class="flex items-center space-x-2">
        <!-- Month Navigation -->
        <div class="flex items-center bg-stone-800/90 rounded-lg p-0.5 border border-stone-700/60 mr-2">
          <button id="btn-prev-month" title="Previous Month" class="px-2 py-1 text-stone-300 hover:text-white hover:bg-stone-700 rounded transition flex items-center">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
          </button>
          <span id="nav-month-label" class="px-3 font-semibold text-stone-200 text-xs tracking-wide">October 2026</span>
          <button id="btn-next-month" title="Next Month" class="px-2 py-1 text-stone-300 hover:text-white hover:bg-stone-700 rounded transition flex items-center">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/></svg>
          </button>
        </div>

        <!-- Manual Refresh Button -->
        <button id="btn-sync" title="Sync Calendar (Hotkey: R)" class="flex items-center space-x-1.5 px-3 py-1.5 bg-gradient-to-r from-amber-600 to-amber-500 hover:from-amber-500 hover:to-amber-400 active:scale-95 text-stone-950 font-bold rounded-lg shadow-sm transition">
          <svg id="sync-icon" class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
          <span>Sync</span>
        </button>

        <!-- Fullscreen Toggle Button -->
        <button id="btn-fullscreen" title="Toggle Fullscreen" class="p-1.5 bg-stone-800 hover:bg-stone-700 text-stone-300 hover:text-white active:scale-95 rounded-lg border border-stone-700 transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/></svg>
        </button>
      </div>
    </header>

    <!-- Main Illustrated Calendar Card Container -->
    <main id="main-card" class="flex flex-1 w-full h-full bg-[#fcf8ee] rounded-2xl overflow-hidden shadow-2xl border border-stone-700/20">
      
      <!-- Left Column: Illustrated Banner + Interactive Calendar Grid -->
      <section class="flex flex-col flex-1 h-full min-w-0 border-r border-[#edd9be]/70">
        
        <!-- Retro Illustrated Halloween Banner -->
        <div class="relative h-32 md:h-36 lg:h-40 w-full overflow-hidden shrink-0 bg-[#fdfaf3] flex items-center justify-between px-6 border-b border-[#ebd3b5]/60 select-none">
          <!-- Background Spooky Trees & Clouds SVG -->
          <svg class="absolute inset-0 w-full h-full pointer-events-none" preserveAspectRatio="none" viewBox="0 0 1000 160">
            <!-- Tree silhouette left -->
            <path d="M-10,0 L70,0 C65,30 40,50 35,80 C32,95 45,120 15,160 L-10,160 Z" fill="#42291d" opacity="0.95" />
            <path d="M40,65 Q80,50 110,60 Q80,72 45,75 Z" fill="#42291d" />
            <!-- Full Moon behind October text -->
            <circle cx="480" cy="80" r="75" fill="#fef08a" opacity="0.3" filter="blur(8px)" />
            <circle cx="480" cy="80" r="65" fill="#fef3c7" opacity="0.65" />
          </svg>

          <!-- Left Illustration: Hanging Lantern, Pumpkin in Witch Hat & Black Cat -->
          <div class="relative z-10 flex items-end space-x-2 self-end mb-1.5">
            <!-- Tiny Hanging Lantern -->
            <div class="hidden sm:block absolute -top-16 -left-3">
              <svg width="24" height="48" viewBox="0 0 24 48">
                <line x1="12" y1="0" x2="12" y2="18" stroke="#3d2314" stroke-width="2" />
                <rect x="5" y="18" width="14" height="22" rx="2" fill="#583119" stroke="#3d2314" stroke-width="1.5" />
                <rect x="8" y="22" width="8" height="14" rx="1" fill="#fde047" />
              </svg>
            </div>

            <!-- Pumpkin with Witch Hat -->
            <div class="relative w-20 h-24 md:w-24 md:h-28">
              <svg viewBox="0 0 100 120" class="w-full h-full drop-shadow-sm">
                <!-- Pumpkin base -->
                <ellipse cx="50" cy="85" rx="36" ry="26" fill="#ea580c" />
                <ellipse cx="50" cy="85" rx="24" ry="26" fill="#f97316" />
                <ellipse cx="50" cy="85" rx="12" ry="25" fill="#fb923c" />
                <!-- Pumpkin face -->
                <polygon points="38,80 44,80 41,74" fill="#29140a" />
                <polygon points="56,80 62,80 59,74" fill="#29140a" />
                <polygon points="48,84 52,84 50,81" fill="#29140a" />
                <path d="M38,90 Q50,99 62,90 Q50,94 38,90 Z" fill="#29140a" />
                <!-- Witch Hat -->
                <ellipse cx="50" cy="66" rx="42" ry="9" fill="#2f293a" />
                <path d="M32,65 Q45,20 62,15 Q54,38 68,64 Z" fill="#2f293a" />
                <!-- Hat band -->
                <path d="M33,64 C42,61 58,61 67,64 L66,60 C57,57 41,57 34,60 Z" fill="#854d0e" />
              </svg>
            </div>

            <!-- Black Cat -->
            <div class="w-14 h-16 md:w-16 md:h-18 -ml-3">
              <svg viewBox="0 0 70 80" class="w-full h-full drop-shadow-sm">
                <!-- Cat Body -->
                <ellipse cx="35" cy="55" rx="20" ry="18" fill="#27232f" />
                <!-- Tail -->
                <path d="M50,62 Q68,60 62,40 Q58,38 58,45" fill="none" stroke="#27232f" stroke-width="4" stroke-linecap="round" />
                <!-- Cat Head -->
                <circle cx="35" cy="35" r="14" fill="#27232f" />
                <!-- Ears -->
                <polygon points="23,28 27,15 33,26" fill="#27232f" />
                <polygon points="37,26 43,15 47,28" fill="#27232f" />
                <!-- Glowing Yellow Eyes -->
                <ellipse cx="30" cy="35" rx="2.5" ry="3.5" fill="#facc15" />
                <ellipse cx="40" cy="35" rx="2.5" ry="3.5" fill="#facc15" />
                <circle cx="30" cy="35" r="1" fill="#18181b" />
                <circle cx="40" cy="35" r="1" fill="#18181b" />
              </svg>
            </div>
          </div>

          <!-- Center: Dynamic Retro Cursive Month & Year Heading -->
          <div class="relative z-10 flex flex-col items-center justify-center text-center">
            <h1 id="month-title" class="font-cursive text-4xl sm:text-5xl md:text-6xl text-[#2d241e] tracking-tight drop-shadow-sm">October</h1>
            <div class="flex items-center space-x-2 mt-0.5">
              <span class="text-amber-500 text-sm">✦</span>
              <span id="year-title" class="font-bold tracking-widest text-[#5c3e2e] text-sm md:text-base">2026</span>
              <span class="text-amber-500 text-sm">✦</span>
            </div>
          </div>

          <!-- Right Illustration: Friendly Ghost & Haunted House Silhouette -->
          <div class="relative z-10 flex items-end space-x-3 self-end mb-1">
            <!-- Ghost -->
            <div class="w-12 h-16 md:w-14 md:h-20">
              <svg viewBox="0 0 60 80" class="w-full h-full drop-shadow-sm">
                <!-- Ghost shape -->
                <path d="M12,45 C12,18 48,18 48,45 C48,68 42,65 38,72 C34,65 30,69 26,72 C22,65 18,68 14,72 C12,65 12,55 12,45 Z" fill="#ffffff" stroke="#3f3933" stroke-width="2" />
                <!-- Eyes -->
                <ellipse cx="26" cy="35" rx="2.5" ry="4" fill="#3f3933" />
                <ellipse cx="36" cy="35" rx="2.5" ry="4" fill="#3f3933" />
                <!-- Surprised mouth with pumpkin blush -->
                <circle cx="31" cy="46" r="4.5" fill="#f97316" opacity="0.9" />
              </svg>
            </div>

            <!-- Haunted House Silhouette -->
            <div class="w-16 h-24 md:w-20 md:h-28">
              <svg viewBox="0 0 90 120" class="w-full h-full">
                <!-- Roofs and turrets -->
                <polygon points="10,65 25,35 40,65" fill="#2d2838" />
                <polygon points="40,55 60,15 80,55" fill="#2d2838" />
                <!-- Main Building -->
                <rect x="15" y="65" width="25" height="50" fill="#2d2838" />
                <rect x="40" y="55" width="40" height="60" fill="#2d2838" />
                <!-- Lit round tower window -->
                <circle cx="60" cy="42" r="5" fill="#fde047" />
              </svg>
            </div>
          </div>
        </div>

        <!-- Weekday Headers (Pastel colored strips SUN-SAT matching aesthetic) -->
        <div class="grid grid-cols-7 border-b border-[#dfcaa7] text-center font-bold text-[11px] sm:text-xs select-none shrink-0">
          <div class="py-1.5 bg-[#f5b895] text-[#542713] border-r border-[#edd2b4]">SUN</div>
          <div class="py-1.5 bg-[#eec2aa] text-[#542713] border-r border-[#edd2b4]">MON</div>
          <div class="py-1.5 bg-[#f6cca9] text-[#542713] border-r border-[#edd2b4]">TUE</div>
          <div class="py-1.5 bg-[#cbe3cb] text-[#204926] border-r border-[#edd2b4]">WED</div>
          <div class="py-1.5 bg-[#edd5ba] text-[#56381e] border-r border-[#edd2b4]">THU</div>
          <div class="py-1.5 bg-[#fcd4b4] text-[#542713] border-r border-[#edd2b4]">FRI</div>
          <div class="py-1.5 bg-[#d8cde3] text-[#412856]">SAT</div>
        </div>

        <!-- Calendar Month Grid Container (Auto-expands to fill vertical height) -->
        <div id="calendar-grid" class="grid grid-cols-7 grid-rows-5 flex-1 w-full bg-[#fcf8ee] divide-x divide-y divide-[#ebd8bf]/70 min-h-0">
          <!-- Calendar day cells dynamically rendered here -->
        </div>
      </section>

      <!-- Right Column: Clean Upcoming Events Agenda Sidebar -->
      <aside class="w-72 sm:w-80 md:w-88 lg:w-96 flex flex-col h-full bg-[#faf5e8] shrink-0">
        <!-- Sidebar Header -->
        <div class="p-4 border-b border-[#eddac2] flex items-center justify-between shrink-0">
          <div>
            <h2 class="font-handwriting text-2xl font-bold text-[#35271e] leading-tight">Upcoming Events</h2>
            <p class="text-[10px] tracking-wider font-bold text-stone-400 uppercase">Next 30 Days</p>
          </div>
          <!-- Item Count Badge -->
          <span id="upcoming-count" class="px-2 py-0.5 text-xs font-bold rounded-full bg-amber-100 text-amber-800 border border-amber-300">
            0
          </span>
        </div>

        <!-- Scrollable Agenda List -->
        <div id="agenda-list" class="flex-1 overflow-y-auto p-3 space-y-2.5 custom-scroll">
          <!-- Dynamic agenda cards injected here -->
        </div>
      </aside>
    </main>
  </div>

  <script>
    // State Management
    let currentNavDate = new Date(2026, 9, 1); // Default to October 2026 matching user's layout
    let allCalendarEvents = [];
    let isFetching = false;

    // Deterministic Calendar Styling & Badge Color Mapping
    const CALENDAR_THEMES = {
      kayla: {
        bg: "bg-purple-50",
        border: "border-purple-500",
        text: "text-purple-900",
        badge: "bg-purple-100 text-purple-800 border-purple-200"
      },
      wedding: {
        bg: "bg-amber-50",
        border: "border-amber-600",
        text: "text-amber-900",
        badge: "bg-amber-100 text-amber-800 border-amber-200"
      },
      personal: {
        bg: "bg-sky-50",
        border: "border-sky-500",
        text: "text-sky-900",
        badge: "bg-sky-100 text-sky-800 border-sky-200"
      },
      general: {
        bg: "bg-stone-50",
        border: "border-stone-400",
        text: "text-stone-800",
        badge: "bg-stone-100 text-stone-700 border-stone-200"
      }
    };

    function getThemeForCalendar(calTitle = "") {
      const lower = calTitle.toLowerCase();
      if (lower.includes("kayla")) return CALENDAR_THEMES.kayla;
      if (lower.includes("wedding") || lower.includes("grosskreuz wedding")) return CALENDAR_THEMES.wedding;
      if (lower.includes("mvgrosskreuz") || lower.includes("grosskreuz")) return CALENDAR_THEMES.personal;
      return CALENDAR_THEMES.general;
    }

    // Live Date/Time Formatter in America/Chicago
    function updateLiveDateTime() {
      const now = new Date();
      const options = {
        timeZone: "America/Chicago",
        weekday: "short",
        month: "short",
        day: "numeric",
        hour: "numeric",
        minute: "2-digit",
        second: "2-digit",
        hour12: true
      };
      const formatter = new Intl.DateTimeFormat("en-US", options);
      const parts = formatter.formatToParts(now);
      
      let weekday = "", month = "", day = "", hour = "", minute = "", second = "", dayPeriod = "";
      for (const p of parts) {
        if (p.type === "weekday") weekday = p.value;
        if (p.type === "month") month = p.value;
        if (p.type === "day") day = p.value;
        if (p.type === "hour") hour = p.value;
        if (p.type === "minute") minute = p.value;
        if (p.type === "second") second = p.value;
        if (p.type === "dayPeriod") dayPeriod = p.value;
      }
      
      const el = document.getElementById("live-datetime");
      if (el) {
        el.textContent = `${weekday}, ${month} ${day} • ${hour}:${minute}:${second} ${dayPeriod}`;
      }
    }
    setInterval(updateLiveDateTime, 1000);
    updateLiveDateTime();

    // Fetch Events from Cloudflare Proxy Worker
    async function fetchCalendarEvents() {
      if (isFetching) return;
      isFetching = true;

      const statusEl = document.getElementById("sync-status");
      const iconEl = document.getElementById("sync-icon");

      if (statusEl) statusEl.textContent = "GCal: Syncing...";
      if (iconEl) iconEl.classList.add("anim-spin");

      try {
        const response = await fetch("https://calendar-proxy.mvgrosskreuz.workers.dev", {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const events = await response.json();
        allCalendarEvents = Array.isArray(events) ? events : [];
        
        if (statusEl) {
          statusEl.textContent = `GCal: Synced (${allCalendarEvents.length} items)`;
          statusEl.className = "text-emerald-400 font-medium";
        }
      } catch (err) {
        console.error("Sync error:", err);
        if (statusEl) {
          statusEl.textContent = `Sync failed (${err.message})`;
          statusEl.className = "text-rose-400 font-medium";
        }
      } finally {
        isFetching = false;
        if (iconEl) iconEl.classList.remove("anim-spin");
        renderCurrentCalendar();
      }
    }

    // Calendar Grid & Sidebar Renderer
    function renderCurrentCalendar() {
      const year = currentNavDate.getFullYear();
      const month = currentNavDate.getMonth(); // 0-based

      // Update titles
      const monthNames = [
        "January", "February", "March", "April", "May", "June",
        "July", "August", "September", "October", "November", "December"
      ];
      document.getElementById("month-title").textContent = monthNames[month];
      document.getElementById("year-title").textContent = year;
      document.getElementById("nav-month-label").textContent = `${monthNames[month]} ${year}`;

      const gridEl = document.getElementById("calendar-grid");
      gridEl.innerHTML = "";

      // Compute calendar range
      const firstDayOfMonth = new Date(year, month, 1);
      const startDayOfWeek = firstDayOfMonth.getDay(); // 0 = Sun
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const daysInPrevMonth = new Date(year, month, 0).getDate();

      // Today in America/Chicago
      const nowChicago = new Date(new Intl.DateTimeFormat("en-US", { timeZone: "America/Chicago" }).format(new Date()));
      const todayYear = nowChicago.getFullYear();
      const todayMonth = nowChicago.getMonth();
      const todayDate = nowChicago.getDate();

      // Build 35 or 42 cells (5 or 6 weeks)
      let totalCells = 35;
      if (startDayOfWeek + daysInMonth > 35) {
        totalCells = 42;
        gridEl.classList.remove("grid-rows-5");
        gridEl.classList.add("grid-rows-6");
      } else {
        gridEl.classList.remove("grid-rows-6");
        gridEl.classList.add("grid-rows-5");
      }

      for (let i = 0; i < totalCells; i++) {
        const cell = document.createElement("div");
        cell.className = "p-1.5 sm:p-2 flex flex-col justify-start overflow-hidden transition-colors relative min-h-0";

        let cellDateNum = 0;
        let isCurrentMonth = true;
        let cellYear = year;
        let cellMonth = month;

        if (i < startDayOfWeek) {
          // Previous Month's Overflow
          cellDateNum = daysInPrevMonth - (startDayOfWeek - 1 - i);
          isCurrentMonth = false;
          cellMonth = month - 1;
          cell.classList.add("bg-[#f7f0df]/70", "text-stone-400");
        } else if (i >= startDayOfWeek + daysInMonth) {
          // Next Month's Overflow
          cellDateNum = i - (startDayOfWeek + daysInMonth) + 1;
          isCurrentMonth = false;
          cellMonth = month + 1;
          cell.classList.add("bg-[#f7f0df]/70", "text-stone-400");
        } else {
          // Current Month Day
          cellDateNum = i - startDayOfWeek + 1;
          cell.classList.add("bg-[#fcf8ee]", "text-stone-800");
        }

        // Highlight Today
        const isToday = (cellYear === todayYear && cellMonth === todayMonth && cellDateNum === todayDate);
        if (isToday) {
          cell.classList.add("ring-2", "ring-inset", "ring-[#8c4927]", "bg-[#fffcf5]");
        }

        // Day Number Header inside Cell
        const numHeader = document.createElement("div");
        numHeader.className = "flex items-center justify-between mb-1";
        
        const numSpan = document.createElement("span");
        numSpan.className = `text-xs sm:text-sm font-semibold leading-none ${isToday ? "text-[#8c4927] font-bold" : ""}`;
        numSpan.textContent = cellDateNum;
        numHeader.appendChild(numSpan);
        cell.appendChild(numHeader);

        // Container for events inside the cell
        const eventsContainer = document.createElement("div");
        eventsContainer.className = "space-y-1 overflow-y-auto custom-scroll flex-1 pr-0.5";

        // Filter events belonging to this cell
        const cellDateISO = `${cellYear}-${String(cellMonth + 1).padStart(2, "0")}-${String(cellDateNum).padStart(2, "0")}`;
        
        const dayEvents = allCalendarEvents.filter(ev => {
          if (!ev.start) return false;
          return ev.start.startsWith(cellDateISO);
        });

        dayEvents.forEach(ev => {
          const theme = getThemeForCalendar(ev.calendarTitle);
          const evPill = document.createElement("div");
          evPill.className = `text-[10px] sm:text-xs leading-snug px-1.5 py-0.5 rounded border-l-2 bg-white/95 border shadow-sm truncate ${theme.border} ${theme.text}`;
          
          let timePrefix = "";
          if (!ev.allDay && ev.start.includes("T")) {
            const timePart = ev.start.split("T")[1];
            const [hh, mm] = timePart.split(":");
            const d = new Date(2000, 0, 1, parseInt(hh, 10), parseInt(mm, 10));
            timePrefix = d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit", hour12: true }) + " ";
          }

          evPill.textContent = `${timePrefix}${ev.summary || "(No Title)"}`;
          evPill.title = `${ev.summary || "(No Title)"} (${ev.calendarTitle || "General"})`;
          eventsContainer.appendChild(evPill);
        });

        cell.appendChild(eventsContainer);
        gridEl.appendChild(cell);
      }

      renderSidebarAgenda();
    }

    // Render Right Sidebar Agenda (Upcoming 30 Days)
    function renderSidebarAgenda() {
      const container = document.getElementById("agenda-list");
      container.innerHTML = "";

      const now = new Date();
      const cutoff30 = new Date(now.getTime() + 30 * 24 * 60 * 60 * 1000);

      // Sort chronological
      const upcoming = allCalendarEvents
        .filter(ev => {
          if (!ev.start) return false;
          const evDate = new Date(ev.start);
          return !isNaN(evDate) && evDate >= new Date(now.getFullYear(), now.getMonth(), now.getDate());
        })
        .sort((a, b) => new Date(a.start) - new Date(b.start))
        .slice(0, 30);

      document.getElementById("upcoming-count").textContent = upcoming.length;

      if (upcoming.length === 0) {
        container.innerHTML = `
          <div class="text-center py-12 text-stone-400 text-xs">
            No upcoming events scheduled for the next 30 days.
          </div>
        `;
        return;
      }

      upcoming.forEach(ev => {
        const theme = getThemeForCalendar(ev.calendarTitle);
        const evDate = new Date(ev.start);
        const card = document.createElement("div");
        card.className = `p-2.5 rounded-xl border bg-white shadow-sm transition hover:shadow-md ${theme.border} border-l-4`;

        // Format Date and Time
        const dateFormatted = evDate.toLocaleDateString("en-US", {
          weekday: "short",
          month: "short",
          day: "numeric"
        }).toUpperCase();

        let timeStr = "All Day";
        if (!ev.allDay && ev.start.includes("T")) {
          timeStr = evDate.toLocaleTimeString("en-US", {
            hour: "numeric",
            minute: "2-digit",
            hour12: true
          });
        }

        card.innerHTML = `
          <div class="flex items-center justify-between text-[10px] font-bold tracking-wider mb-1">
            <span class="${theme.text}">${dateFormatted}</span>
            <span class="text-stone-400 font-semibold">${timeStr}</span>
          </div>
          <div class="text-xs sm:text-sm font-semibold text-stone-800 leading-snug">
            ${escapeHTML(ev.summary || "(No Title)")}
          </div>
          <div class="text-[10px] text-stone-400 mt-1">
            ${escapeHTML(ev.calendarTitle || "General")}
          </div>
        `;

        container.appendChild(card);
      });
    }

    function escapeHTML(str) {
      return str.replace(/[&<>"']/g, match => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;"
      }[match]));
    }

    // Fullscreen API Helper
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          console.warn("Fullscreen request error:", err);
        });
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    // Setup Event Listeners
    window.addEventListener("DOMContentLoaded", () => {
      // Month navigation
      document.getElementById("btn-prev-month").addEventListener("click", () => {
        currentNavDate.setMonth(currentNavDate.getMonth() - 1);
        renderCurrentCalendar();
      });

      document.getElementById("btn-next-month").addEventListener("click", () => {
        currentNavDate.setMonth(currentNavDate.getMonth() + 1);
        renderCurrentCalendar();
      });

      // Sync button
      document.getElementById("btn-sync").addEventListener("click", () => {
        fetchCalendarEvents();
      });

      // Fullscreen button
      document.getElementById("btn-fullscreen").addEventListener("click", toggleFullscreen);

      // Keyboard Hotkeys
      window.addEventListener("keydown", (e) => {
        if (e.key === "r" || e.key === "R") {
          fetchCalendarEvents();
        }
      });

      // Initial Fetch & Render
      renderCurrentCalendar();
      fetchCalendarEvents();

      // Background Poll every 5 minutes
      setInterval(fetchCalendarEvents, 5 * 60 * 1000);
    });
  </script>
</body>
</html>
