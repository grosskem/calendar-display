<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Themed Wall Calendar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-canvas: #1a1614;
      --board-bg: #fcfbf7;
      --board-border: #3d2b1f;
      --border-soft: #ddd4c5;
      --border-hard: #2b1d14;
      --text-main: #2b1d14;
      --text-muted: #7d7265;
      --accent: #8b4513;
      --accent-light: #f5ebe0;
      --font-display: 'Caveat', cursive;
      --font-body: 'Patrick Hand', cursive, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-canvas);
      color: var(--text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      overflow: hidden;
    }

    .top-bar {
      width: 100%;
      max-width: 1200px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #eae3d6;
      font-size: 0.95rem;
      margin-bottom: 0.5rem;
      padding: 0 0.5rem;
    }

    .calendar-frame {
      position: relative;
      width: 95vw;
      max-width: 1200px;
      aspect-ratio: 1000 / 720;
      background: var(--board-bg);
      border: 3px solid var(--board-border);
      border-radius: 12px;
      box-shadow: 0 16px 45px rgba(0,0,0,0.6);
      display: grid;
      grid-template-columns: 1fr 280px;
      overflow: hidden;
    }

    .calendar-main {
      display: flex;
      flex-direction: column;
      height: 100%;
      border-right: 2px solid var(--border-soft);
      min-width: 0;
    }

    .theme-header {
      height: 24%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 2rem;
      background: radial-gradient(circle at 50% 80%, #fffbf2 0%, #faedd8 100%);
      border-bottom: 2px solid #ecdac3;
      user-select: none;
    }

    .theme-art { font-size: 3.2rem; filter: drop-shadow(0 3px 5px rgba(0,0,0,0.12)); }
    .theme-center { text-align: center; }
    .theme-title { font-family: var(--font-display); font-size: 4.2rem; font-weight: 700; line-height: 0.9; }
    .theme-year { font-size: 1.8rem; letter-spacing: 2px; }

    .weekday-bar {
      height: 5.5%;
      margin: 0.4rem 0.8rem 0 0.8rem;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-size: 1.05rem;
      font-weight: bold;
      border: 2px solid var(--border-hard);
      border-bottom: none;
      border-radius: 6px 6px 0 0;
      overflow: hidden;
    }

    .weekday-bar div {
      display: flex;
      align-items: center;
      justify-content: center;
      border-right: 1.5px solid var(--border-hard);
    }
    .weekday-bar div:last-child { border-right: none; }

    .days-grid {
      flex: 1;
      margin: 0 0.8rem 0.8rem 0.8rem;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      grid-template-rows: repeat(5, 1fr);
      border: 2px solid var(--border-hard);
      border-radius: 0 0 6px 6px;
      overflow: hidden;
      background: #ffffff;
      min-height: 0;
    }

    .cell {
      border-right: 1.5px solid var(--border-hard);
      border-bottom: 1.5px solid var(--border-hard);
      padding: 4px;
      display: flex;
      flex-direction: column;
      position: relative;
      min-width: 0;
      min-height: 0;
    }
    .cell:nth-child(7n) { border-right: none; }
    .cell:nth-last-child(-n+7) { border-bottom: none; }
    .cell.inactive { opacity: 0.35; background: #faf8f5; }
    .cell.today { background: var(--accent-light); }

    .cell-num {
      font-size: 1.05rem;
      font-weight: bold;
      line-height: 1;
      display: inline-block;
      width: 22px;
      height: 22px;
      text-align: center;
    }
    .cell.today .cell-num {
      background: var(--accent);
      color: #fff;
      border-radius: 50%;
    }

    .cell-events {
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin-top: 3px;
      overflow: hidden;
    }

    .chip {
      background: #fff8e6;
      border-left: 3px solid var(--accent);
      padding: 1px 4px;
      font-size: 0.8rem;
      line-height: 1.15;
      border-radius: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .agenda-panel {
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      background: var(--board-bg);
      height: 100%;
      min-height: 0;
    }

    .agenda-title {
      font-family: var(--font-display);
      font-size: 1.8rem;
      border-bottom: 2px solid var(--border-soft);
      padding-bottom: 4px;
      margin-bottom: 0.8rem;
    }

    .agenda-list {
      list-style: none;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .agenda-item { display: flex; flex-direction: column; gap: 1px; }
    .agenda-date { font-size: 0.75rem; text-transform: uppercase; font-weight: bold; color: var(--accent); }
    .agenda-text { font-size: 0.95rem; font-weight: bold; }
    .agenda-time { font-size: 0.8rem; color: var(--text-muted); }

    .c-sun { background: #fed7aa; color: #7c2d12; }
    .c-mon { background: #dcd0e8; color: #2c1a4d; }
    .c-tue { background: #fbd38d; color: #744210; }
    .c-wed { background: #c6f6d5; color: #22543d; }
    .c-thu { background: #e9d8fd; color: #44337a; }
    .c-fri { background: #feebc8; color: #7b341e; }
    .c-sat { background: #cbd5e0; color: #2d3748; }
  </style>
</head>
<body>

  <div class="top-bar">
    <div id="liveClock">--:-- --</div>
    <div id="syncStatus">Initializing...</div>
  </div>

  <div class="calendar-frame">
    <div class="calendar-main">
      <div class="theme-header">
        <div class="theme-art">🎃 🐈‍⬛</div>
        <div class="theme-center">
          <div class="theme-title" id="monthName">October</div>
          <div class="theme-year" id="yearNumber">2026</div>
        </div>
        <div class="theme-art">👻 🏚️</div>
      </div>

      <div class="weekday-bar">
        <div class="c-sun">SUN</div>
        <div class="c-mon">MON</div>
        <div class="c-tue">TUE</div>
        <div class="c-wed">WED</div>
        <div class="c-thu">THU</div>
        <div class="c-fri">FRI</div>
        <div class="c-sat">SAT</div>
      </div>

      <div class="days-grid" id="daysGrid"></div>
    </div>

    <div class="agenda-panel">
      <div class="agenda-title">Upcoming Schedule</div>
      <ul class="agenda-list" id="agendaFeed"></ul>
    </div>
  </div>

  <script>
    // -----------------------------------------------------------
    // Set your proxy URL here:
    // If using the standalone Worker: "https://calendar-proxy.<subdomain>.workers.dev"
    // If using Pages Functions: "/api/calendar"
    // -----------------------------------------------------------
    const PROXY_URL = "https://calendar-proxy.<your-subdomain>.workers.dev";

    function updateClock() {
      const now = new Date();
      document.getElementById("liveClock").textContent = now.toLocaleTimeString([], { 
        hour: '2-digit', 
        minute: '2-digit', 
        second: '2-digit' 
      });
    }
    setInterval(updateClock, 1000);
    updateClock();

    function renderBaseGrid() {
      const now = new Date();
      const yr = now.getFullYear();
      const mo = now.getMonth();
      const todayNum = now.getDate();

      const months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
      document.getElementById("monthName").textContent = months[mo];
      document.getElementById("yearNumber").textContent = yr;

      const firstDay = new Date(yr, mo, 1).getDay();
      const daysCount = new Date(yr, mo + 1, 0).getDate();
      const prevCount = new Date(yr, mo, 0).getDate();

      const grid = document.getElementById("daysGrid");
      grid.innerHTML = "";

      // Prior month padding
      for (let i = firstDay - 1; i >= 0; i--) {
        const d = document.createElement("div");
        d.className = "cell inactive";
        d.innerHTML = `<span class="cell-num">${prevCount - i}</span>`;
        grid.appendChild(d);
      }

      // Current month days
      for (let day = 1; day <= daysCount; day++) {
        const d = document.createElement("div");
        const isToday = (day === todayNum);
        d.className = `cell ${isToday ? 'today' : ''}`;
        const mStr = String(mo + 1).padStart(2, '0');
        const dStr = String(day).padStart(2, '0');
        d.setAttribute("data-date", `${yr}-${mStr}-${dStr}`);
        d.innerHTML = `<span class="cell-num">${day}</span><div class="cell-events"></div>`;
        grid.appendChild(d);
      }

      // Trailing days padding
      const totalSoFar = firstDay + daysCount;
      const targetTotal = totalSoFar <= 35 ? 35 : 42;
      for (let i = 1; i <= (targetTotal - totalSoFar); i++) {
        const d = document.createElement("div");
        d.className = "cell inactive";
        d.innerHTML = `<span class="cell-num">${i}</span>`;
        grid.appendChild(d);
      }
    }

    function parseICS(icsText) {
      const events = [];
      const lines = icsText.replace(/\r\n /g, "").replace(/\r/g, "").split("\n");
      let inEvent = false;
      let cur = {};

      for (let line of lines) {
        if (line.startsWith("BEGIN:VEVENT")) {
          inEvent = true;
          cur = {};
        } else if (line.startsWith("END:VEVENT")) {
          inEvent = false;
          if (cur.date && cur.summary) {
            events.push(cur);
          }
        } else if (inEvent) {
          if (line.startsWith("SUMMARY:")) {
            cur.summary = line.substring(8).trim();
          } else if (line.startsWith("DTSTART")) {
            const parts = line.split(":");
            const val = parts[1];
            if (val && val.length === 8) {
              cur.date = `${val.substring(0,4)}-${val.substring(4,6)}-${val.substring(6,8)}`;
              cur.time = "All Day";
            } else if (val) {
              const yr = val.substring(0,4), mo = val.substring(4,6), dy = val.substring(6,8);
              const hr = val.substring(9,11), mn = val.substring(11,13);
              const dt = new Date(Date.UTC(yr, mo-1, dy, hr, mn));
              const localY = dt.getFullYear();
              const localM = String(dt.getMonth() + 1).padStart(2, '0');
              const localD = String(dt.getDate()).padStart(2, '0');
              cur.date = `${localY}-${localM}-${localD}`;
              cur.time = dt.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
            }
          }
        }
      }
      return events;
    }

    async function syncCalendar() {
      const statusEl = document.getElementById("syncStatus");
      statusEl.textContent = "Fetching events...";

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 8000);

      try {
        const res = await fetch(PROXY_URL, { signal: controller.signal });
        clearTimeout(timeoutId);

        if (!res.ok) {
          throw new Error(`HTTP ${res.status}`);
        }

        const rawICS = await res.text();
        const events = parseICS(rawICS);
        statusEl.textContent = `Synced: ${events.length} events loaded`;

        // Clear existing chips
        document.querySelectorAll(".cell-events").forEach(el => el.innerHTML = "");

        // Render chips into grid
        events.forEach(e => {
          const cell = document.querySelector(`.cell[data-date="${e.date}"] .cell-events`);
          if (cell) {
            const chip = document.createElement("div");
            chip.className = "chip";
            chip.title = e.summary;
            chip.textContent = e.summary;
            cell.appendChild(chip);
          }
        });

        // Render Agenda
        const agenda = document.getElementById("agendaFeed");
        agenda.innerHTML = "";
        const now = new Date();
        const todayMid = new Date(now.getFullYear(), now.getMonth(), now.getDate());

        const upcoming = events
          .filter(e => new Date(e.date + "T00:00:00") >= todayMid)
          .sort((a,b) => a.date.localeCompare(b.date))
          .slice(0, 9);

        if (upcoming.length === 0) {
          agenda.innerHTML = `<li class="agenda-item"><span class="agenda-time">No upcoming events</span></li>`;
        } else {
          upcoming.forEach(e => {
            const li = document.createElement("li");
            li.className = "agenda-item";
            const dObj = new Date(e.date + "T00:00:00");
            const formatted = dObj.toLocaleDateString("en-US", { weekday: 'short', month: 'short', day: 'numeric' });
            li.innerHTML = `
              <span class="agenda-date">${formatted}</span>
              <span class="agenda-text">${e.summary}</span>
              <span class="agenda-time">${e.time}</span>
            `;
            agenda.appendChild(li);
          });
        }
      } catch (err) {
        clearTimeout(timeoutId);
        console.warn("Sync error:", err);
        statusEl.textContent = `Sync failed (${err.message})`;
      }
    }

    // 1. Immediately draw the base October grid and dates
    renderBaseGrid();

    // 2. Fetch and render Google Calendar events
    syncCalendar();

    // 3. Auto-sync every 15 minutes
    setInterval(syncCalendar, 15 * 60 * 1000);
  </script>
</body>
</html>
